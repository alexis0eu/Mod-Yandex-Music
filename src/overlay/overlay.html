<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Yandex Music Gaming Overlay</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body class="theme-steam">
  <div class="overlay-card" id="overlay-card">
    <!-- Draggable Header -->
    <div class="header-bar">
      <div class="header-left">
        <span class="hud-badge"><span class="status-dot" id="status-dot"></span> GAMING HUD</span>
        <span class="hud-title">Яндекс Музыка</span>
      </div>
      <div class="header-right no-drag">
        <button id="btn-ghost" class="hud-btn" title="Включить/выключить сквозной клик (Ghost mode)">
          <span class="btn-icon">👻</span>
          <span class="btn-text" id="ghost-label">Кликабельный</span>
        </button>
        <button id="btn-lyrics-toggle" class="hud-btn active" title="Показать/скрыть текст песни в оверлее">
          <span class="btn-icon">📜</span>
        </button>
        <button id="btn-karaoke" class="hud-btn" title="Открыть плавающее караоке (Ctrl+Shift+L)">
          <span class="btn-icon">🎤</span>
        </button>
        <button id="btn-close" class="hud-btn btn-close" title="Скрыть оверлей (Ctrl+Shift+O)">✕</button>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="content-row">
      <!-- Album Art & Visualizer -->
      <div class="cover-wrapper no-drag">
        <img id="track-cover" class="track-cover" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23222533'/><text x='50' y='55' font-size='32' text-anchor='middle' fill='%23666'>♫</text></svg>" alt="Cover" />
        <div class="equalizer-bars" id="eq-bars">
          <div class="bar bar-1"></div>
          <div class="bar bar-2"></div>
          <div class="bar bar-3"></div>
          <div class="bar bar-4"></div>
        </div>
      </div>

      <!-- Info & Controls -->
      <div class="player-details">
        <div class="meta-container">
          <div class="track-title" id="track-title">Трек не воспроизводится</div>
          <div class="track-artist" id="track-artist">Откройте Яндекс Музыку</div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-section no-drag">
          <span class="time-label" id="time-current">0:00</span>
          <div class="progress-bar-container" id="progress-bar-container">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
            <div class="progress-bar-thumb" id="progress-bar-thumb"></div>
          </div>
          <span class="time-label" id="time-total">0:00</span>
        </div>

        <!-- Controls Row -->
        <div class="controls-row no-drag">
          <button class="ctrl-btn" id="btn-prev" title="Предыдущий трек">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
            </svg>
          </button>
          
          <button class="ctrl-btn btn-play" id="btn-play" title="Воспроизведение / Пауза">
            <svg id="icon-play" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <svg id="icon-pause" class="hidden" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
          </button>

          <button class="ctrl-btn" id="btn-next" title="Следующий трек">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
            </svg>
          </button>

          <button class="ctrl-btn btn-like" id="btn-like" title="Нравится">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </button>

          <div class="shortcut-hint" title="Быстрые клавиши: Ctrl+Shift+O (Оверлей) / Ctrl+Shift+L (Караоке)">
            🎮 Ctrl+Shift+O
          </div>
        </div>

        <!-- Synchronized Karaoke Lyrics Bar in Overlay -->
        <div class="overlay-lyrics-container" id="overlay-lyrics-container">
          <div class="overlay-lyrics-line" id="overlay-lyrics-active">♫ Текст песни синхронизируется...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
